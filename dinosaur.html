<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小恐龍遊戲</title>
    <style>
        /* --- 1. 字體設定 --- */
        @font-face {
            font-family: 'Cubic';
            src: url('Cubic_11.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column; 
            height: 100vh;
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            overflow: hidden; 
        }

        /* --- 2. UI 介面層 (獨立頂部區塊) --- */
        .ui-header {
            position: relative; 
            width: 100%;
            height: 80px;      
            background-color: #ffffff; 
            border-bottom: 2px solid #333; 
            display: flex;
            justify-content: space-between;
            align-items: center; 
            padding: 0 40px;    
            z-index: 1000;
        }

        /* 左上角 Home 鍵 */
        .home-btn {
            display: block;
            width: 50px;
            height: 50px;
            transition: transform 0.2s;
        }
        
        .home-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .home-btn:hover {
            transform: scale(1.1);
        }

        /* 右上角 漢堡選單容器 */
        .menu-container {
            position: relative;
            font-family: 'Cubic', sans-serif;
        }

        /* 漢堡按鈕區域 */
        .hamburger-icon {
            width: 35px;  
            height: 30px;
            cursor: pointer;
            position: relative; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 包裹原本的三條線 */
        .lines-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: opacity 0.2s;
        }

        /* 線條樣式 */
        .lines-wrapper span {
            display: block;
            width: 100%;
            height: 4px;
            background-color: #333;
            border-radius: 4px;
        }

        /* Hover 圖片樣式 (置中且放大) */
        .hover-img {
            width: 55px;  
            height: auto;
            object-fit: contain;
            display: none; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* === 互動顯示邏輯 === */
        .hamburger-icon:hover .lines-wrapper { display: none; }
        .hamburger-icon:hover .hover-img { display: block; }
        .menu-container.active .hamburger-icon .lines-wrapper { display: none; }
        .menu-container.active .hamburger-icon .hover-img { display: block; }
        
        /* --- 展開後的選單列表 --- */
        .menu-list {
            position: absolute;
            top: 60px; 
            right: 0;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 8px;
            width: 140px;
            display: none;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
            z-index: 1001;
        }

        .menu-list.show {
            display: flex;
        }

        .menu-list a {
            text-decoration: none;
            color: #333;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            transition: background 0.2s;
        }

        .menu-list a:last-child {
            border-bottom: none;
        }

        .menu-list a:hover {
            background-color: #f0f0f0;
            color: #000;
        }

        /* =========================================
           Activity 彈窗與六張圖層設定
           ========================================= */
        #activity-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.85); 
            z-index: 20000; 
            opacity: 0;
            pointer-events: none; 
            transition: opacity 0.5s ease;
        }

        #activity-popup.show-popup {
            opacity: 1;
            pointer-events: auto; 
        }

        .popup-layer {
            position: absolute;
            opacity: 0;
            transform: scale(0.8); 
            transition: opacity 0.4s ease, transform 0.4s ease;
            cursor: pointer;
            pointer-events: none; 
        }

        .popup-layer.layer-visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto; 
        }

        #pop-layer1 { z-index: 16; top: 16%; left: 40%; width: 27%; }
        #pop-layer2 { z-index: 15; top: 40%; left: 27%; width: 35%; }
        #pop-layer3 { z-index: 14; top: 23%; left: 60%; width: 23%; }
        #pop-layer4 { z-index: 13; top: 65%; left: 10%; width: 25%; }
        #pop-layer5 { z-index: 12; top: 50%; left: 60%; width: 20%; }
        #pop-layer6 { z-index: 11; top: 30%; left: 18%; width: 20%; }

        /* --- 3. 遊戲區域 CSS (完全保留原始設定) --- */
        #gameArea {
            margin: auto; /* 讓遊戲畫面在視窗置中 */
            width: 800px;
            height: 300px;
            position: relative;
            background-image: url("https://github.com/yen143/u/blob/main/bg3.png?raw=true");
            background-repeat: no-repeat;
            background-position: center top;
            background-size: 100% 75%; 
            overflow: hidden; /* 避免障礙物飛出框外時造成卷軸 */
            border: 2px solid #ccc; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        #dino, #obstacle {
            position: absolute;
            z-index: 5; 
        }

        #dino {
            position: absolute;
            bottom: 20px;
            right: 50px; /* 原本設定：綠人在右邊 */
            width: 50px;
            height: 70px;
        }

        #obstacle {
            position: absolute;
            bottom: 15px;
            left: -50px; /* 原本設定：障礙物在左邊 */
            width: 50px;
            height: 50px;
        }

        #startMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: black;
            font-family: Arial, sans-serif;
            z-index: 10;
            background: rgba(255,255,255,0.9); 
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
        }

        #scoreDisplay {
            display: none;
            font-family: Arial, "微軟正黑體", sans-serif;
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 25px;
            color: black;
            z-index: 5;
            font-weight: bold;
        }

        .cloud {
            position: absolute;
            width: 50px;
            height: auto;
            opacity: 0.9;
            display: none;
        }

        .near { z-index: 3; opacity: 1; }
        .far { z-index: 1; opacity: 1; }

        #ground {
            position: absolute;
            bottom: 20px; 
            left: 0;
            width: 100%;
            height: 2px; 
            background-color: #444; 
            z-index: 4; 
        }

    </style>
</head>
<body>

    <!-- UI 導覽列 -->
    <div class="ui-header">
        <a href="index.html?skip=true" class="home-btn">
            <img src="firstpic/home.png" alt="Home">
        </a>

        <div class="menu-container" id="menuContainer">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <div class="lines-wrapper">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <img src="firstpic/hover.png" alt="Menu Hover" class="hover-img">
            </div>

            <div class="menu-list" id="menuList">
                <a href="bookri.html">關於</a>
                <a href="bookle.html">周邊</a>
                <a href="#" id="obj-activity" class="obj-container">活動</a>
                
                <div id="activity-popup">
                    <img class="popup-layer" id="pop-layer6" src="thirdpic/6.png">
                    <img class="popup-layer" id="pop-layer5" src="thirdpic/5.png">
                    <img class="popup-layer" id="pop-layer4" src="thirdpic/4.png">
                    <img class="popup-layer" id="pop-layer3" src="thirdpic/3.png">
                    <img class="popup-layer" id="pop-layer2" src="thirdpic/2.png">
                    <img class="popup-layer" id="pop-layer1" src="thirdpic/1.png">
                </div>
                
                <a href="calender.html">品牌</a>
                <a href="computer.html">地圖</a>
            </div>
        </div>
    </div>

    <!-- 遊戲區域 -->
    <div id="gameArea">
        <div id="ground"></div> 
        <img id="dino" src="https://github.com/yen143/u/blob/main/walk_1.gif?raw=true" alt="dino">
        <img id="obstacle" src="https://github.com/yen143/u/blob/main/Trafficcone.png?raw=true" alt="traffic cone"> 
        <img id="cloud1" class="cloud near" src="https://github.com/yen143/u/blob/main/flycat1.png?raw=true" >
        <img id="cloud2" class="cloud far" src="https://github.com/yen143/u/blob/main/flycat1.png?raw=true" >
        <div id="scoreDisplay">SCORE: 000000</div>
        <div id="startMessage">click to start</div>
    </div>

    <script>
        // =========================================
        // UI 選單與彈窗互動邏輯
        // =========================================
        function toggleMenu() {
            const menuList = document.getElementById('menuList');
            const menuContainer = document.getElementById('menuContainer');
            
            menuList.classList.toggle('show');
            menuContainer.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const menuContainer = document.getElementById('menuContainer');
            const menuList = document.getElementById('menuList');
            
            if (!menuContainer.contains(event.target)) {
                menuList.classList.remove('show');
                menuContainer.classList.remove('active');
            }
        });

        const btnActivity = document.getElementById('obj-activity');
        const activityPopup = document.getElementById('activity-popup');
        
        const popLayers = [
            document.getElementById('pop-layer6'),
            document.getElementById('pop-layer5'),
            document.getElementById('pop-layer4'),
            document.getElementById('pop-layer3'),
            document.getElementById('pop-layer2'),
            document.getElementById('pop-layer1')
        ];

        btnActivity.addEventListener('click', function(e) {
            e.preventDefault(); 
            activityPopup.classList.add('show-popup'); 
            
            popLayers.forEach((layer, index) => {
                setTimeout(() => {
                    layer.classList.add('layer-visible');
                }, 300 + (index * 150)); 
            });
        });

        popLayers.forEach((layer, index) => {
            layer.addEventListener('click', function() {
                this.classList.remove('layer-visible');
                
                if (index === 0) {
                    setTimeout(() => {
                        activityPopup.classList.remove('show-popup');
                    }, 400); 
                }
            });
        });


        // =========================================
        // 遊戲核心邏輯 (完全保留你的原始設定)
        // =========================================
        const dino = document.getElementById('dino');
        const obstacle = document.getElementById('obstacle');
        const startMessage = document.getElementById('startMessage');
        const scoreDisplay = document.getElementById('scoreDisplay');  
        const cloud1 = document.getElementById('cloud1');
        const cloud2 = document.getElementById('cloud2');

        dino.style.bottom = "20px";

        let isJumping = false;
        let gameOver = false;
        let gameStarted = false;
        let obstacleX = -50;  // 障礙物從左邊開始移動
        let score = 0;  
        
        let cloud1X = 0;
        let cloud2X = 0;
        let cloud1Y = 0;
        let cloud2Y = 0;

        scoreDisplay.innerText = `SCORE: ${score.toString().padStart(5, '0')}`;

        function startGame() {
            if (gameStarted) return;

            gameStarted = true;
            startMessage.style.display = 'none';  
            scoreDisplay.style.display = 'block'; 
            cloud1.style.display = "block";
            cloud2.style.display = "block";
          
            cloud1X = window.innerWidth * 0.2;
            cloud2X = window.innerWidth * 0.4;
          
            moveObstacle();
            moveClouds();
            startScoreTimer();
        }

        function startScoreTimer() {
            setInterval(() => {
                if (!gameOver) {  
                    score += 10;  
                    scoreDisplay.innerText = `SCORE: ${score.toString().padStart(5, '0')}`;  
                }
            }, 1000);  
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;

            let jumpHeight = 0;
            const up = setInterval(() => {
                if (jumpHeight < 90) {  
                    jumpHeight += 10;
                    dino.style.bottom = 20 + jumpHeight + "px";
                } else {
                    clearInterval(up);
                    const down = setInterval(() => {
                        if (jumpHeight > 0) {
                            jumpHeight -= 4;
                            dino.style.bottom = 20 + jumpHeight + "px";
                        } else {
                            clearInterval(down);
                            isJumping = false;
                        }
                    }, 20);
                }
            }, 20);
        }

        // 鍵盤觸發
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 避免空白鍵往下捲動
                if (!gameStarted) {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        // 滑鼠點擊觸發
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                // 確保點擊的不是右上角的選單，才觸發跳躍
                if (!document.getElementById('menuContainer').contains(e.target)) {
                    if (!gameStarted) {
                        startGame();
                    } else {
                        jump();
                    }
                }
            }
        });

        // 點擊 "click to start" 也能開始遊戲
        startMessage.addEventListener('click', startGame);

        function moveClouds() {
            if (gameOver) return;

            cloud1X -= 1;
            cloud2X -= 0.5;
            cloud1Y = 50 + Math.sin(Date.now() / 500) * 10;
            cloud2Y = 30 + Math.sin(Date.now() / 700) * 8;

            cloud1.style.left = cloud1X + "px";
            cloud1.style.top = cloud1Y + "px";
            cloud2.style.left = cloud2X + "px";
            cloud2.style.top = cloud2Y + "px";

            if (cloud1X < -100) cloud1X = 800;
            if (cloud2X < -100) cloud2X = 800;

            requestAnimationFrame(moveClouds);
        }

        function moveObstacle() {
            if (gameOver) return;

            obstacleX += 10;  // 每幀向右移動
            obstacle.style.left = obstacleX + "px"; 

            // 以 800 (遊戲框寬度) 作為障礙物重生的邊界，避免等太久
            if (obstacleX > 800) {
                obstacleX = -50;
            }
          
            const dinoBottom = parseInt(dino.style.bottom) || 20; 
            const dinoLeft = parseInt(getComputedStyle(dino).left);
            const dinoRight = dinoLeft + 50;  
            
            const obstacleLeft = obstacleX;
            const obstacleRight = obstacleLeft + 50;  

            const horizontalCollision = obstacleRight > dinoLeft && obstacleLeft < dinoRight;
            const verticalCollision = dinoBottom < 60; 

            if (horizontalCollision && verticalCollision) {
                gameOver = true;
                alert(`遊戲結束！ 你的分數是: ${score}`);
                location.reload(); 
                return;
            }
            requestAnimationFrame(moveObstacle);
        }
    </script>
</body>
</html>
